name: Build LucidHealth iOS

on:
  push:
    paths:
      - 'ios/LucidHealth/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the build number is derived from it

      # The build number used to be github.run_number. That counter belongs to
      # the Actions history, not to the code, and when this repo's history was
      # reset it restarted at 1 — stamping a build 1.0.1 while the phone had
      # 1.0.96, so AltStore saw a downgrade and offered no update. Commit count
      # is a property of the repository, so it cannot be reset out from under a
      # released build.
      - name: Derive build number (monotonic - never below what is published)
        env:
          SUPABASE_STORAGE_PUBLIC_BASE: ${{ vars.SUPABASE_STORAGE_PUBLIC_BASE }}
        run: |
          COMMITS=$(git rev-list --count HEAD)

          # Commit count is a property of the repository, so it survives an
          # Actions-counter reset. It does NOT survive a history rewrite, and it
          # says nothing about what the phone has actually been offered. Either
          # one can silently produce a build that numbers itself at or below the
          # installed version, at which point AltStore correctly shows "no
          # update" - forever, with a green build every time and nothing in the
          # log that looks wrong.
          #
          # The published source.json is the only record of what the device has
          # been offered, so clamp against it. Monotonic by construction from
          # here on, whatever happens to git history.
          SRC="${SUPABASE_STORAGE_PUBLIC_BASE}/altstore-source.json"
          JQ='[.apps[] | select(.bundleIdentifier == "com.fabi.lucidhealth") | .buildVersion | tonumber] | first // 0'
          PUBLISHED=$(curl -fsS --max-time 20 "$SRC" | jq -r "$JQ") || PUBLISHED=0
          case "$PUBLISHED" in ''|*[!0-9]*) PUBLISHED=0 ;; esac

          if [ "$COMMITS" -gt "$PUBLISHED" ]; then
            BUILD_NUM=$COMMITS
          else
            BUILD_NUM=$((PUBLISHED + 1))
            echo "::warning::commit count ($COMMITS) is at or below the published build ($PUBLISHED). Bumping to $BUILD_NUM so AltStore sees an update."
          fi

          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          echo "commits=${COMMITS} published=${PUBLISHED} -> build ${BUILD_NUM}"

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks | grep iphoneos || echo "No iphoneos SDK found"

      # Gemini key is NOT injected anymore — food analysis is proxied through the
      # server (analyze_food_photo / analyze_food_text RPCs), key lives in Supabase
      # Vault. Nothing secret ships in the public IPA. (Old inject+echo step removed.)

      # A missing secret substitutes as an empty string and the build still goes
      # green — it just ships an IPA that cannot log in. That is exactly what
      # happened when this repo was deleted and re-uploaded: HERMES_USER_ID was
      # never re-added, so the app baked `userId = ""` and signed itself out.
      # Fail here instead, where the cause is legible.
      - name: Require every injected secret to exist
        env:
          EE_TASKS_EMAIL: ${{ secrets.EE_TASKS_EMAIL }}
          EE_TASKS_PASSWORD: ${{ secrets.EE_TASKS_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HERMES_USER_ID: ${{ secrets.HERMES_USER_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
        run: |
          MISSING=""
          for NAME in EE_TASKS_EMAIL EE_TASKS_PASSWORD SUPABASE_ANON_KEY HERMES_USER_ID SUPABASE_URL; do
            eval "VALUE=\${$NAME}"
            [ -n "$VALUE" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: missing repository secret(s)/variable(s):$MISSING"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "All injected secrets present."

      - name: Inject auth credentials + Supabase config
        run: |
          # Email + password (login auto-fill)
          sed -i '' 's|static let prefilledEmail: String = "BUILD_EMAIL"|static let prefilledEmail: String = "${{ secrets.EE_TASKS_EMAIL }}"|' \
            ios/LucidHealth/LucidHealth/Services/SupabaseClient.swift
          sed -i '' 's|static let prefilledPassword: String = "BUILD_PASSWORD"|static let prefilledPassword: String = "${{ secrets.EE_TASKS_PASSWORD }}"|' \
            ios/LucidHealth/LucidHealth/Services/SupabaseClient.swift

          # Supabase URL, anon key, and Hermes user ID — injected from GHA secrets/vars
          sed -i '' 's|"BUILD_SUPABASE_URL"|"${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}"|' \
            ios/LucidHealth/LucidHealth/Services/SupabaseClient.swift
          sed -i '' 's|"BUILD_ANON_KEY"|"${{ secrets.SUPABASE_ANON_KEY }}"|' \
            ios/LucidHealth/LucidHealth/Services/SupabaseClient.swift
          sed -i '' 's|"BUILD_USER_ID"|"${{ secrets.HERMES_USER_ID }}"|' \
            ios/LucidHealth/LucidHealth/Services/SupabaseClient.swift

          echo "=== SupabaseClient after injection (values masked) ==="
          grep -E 'prefilledEmail|prefilledPassword|baseURL|anonKey|let userId' \
            ios/LucidHealth/LucidHealth/Services/SupabaseClient.swift | \
            sed 's/= ".*"/= "***"/' | head -8

      - name: Inject commit SHA + build date into BuildInfo.swift
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUILD_INFO=ios/LucidHealth/LucidHealth/BuildInfo.swift
          sed -i '' "s|static let commitHash: String = \"local-dev\"|static let commitHash: String = \"${GITHUB_SHA}\"|" "$BUILD_INFO"
          sed -i '' "s|static let buildDate:  String = \"unknown\"|static let buildDate:  String = \"${BUILD_DATE}\"|" "$BUILD_INFO"
          echo "=== BuildInfo.swift after injection ==="
          cat "$BUILD_INFO"

      - name: Build for device (ad-hoc signed with entitlements)
        working-directory: ios/LucidHealth
        run: |
          xcodebuild build \
            -project LucidHealth.xcodeproj \
            -scheme LucidHealth \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            SWIFT_VERSION=5.0 \
            CURRENT_PROJECT_VERSION=${BUILD_NUM} \
            MARKETING_VERSION=1.0.${BUILD_NUM} \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            SUPPORTS_MACCATALYST=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee build.log || true

          grep -i "error:" build.log || echo "No explicit errors found"
          grep -c "error:" build.log && exit 65 || true

      - name: Verify embedded entitlements (App Groups must survive)
        run: |
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "LucidHealth.app" -type d | head -1)
          echo "=== Main app entitlements ==="
          codesign -d --entitlements - "$APP_PATH" 2>&1 | tee main-ent.txt || true
          if ! grep -q "application-groups" main-ent.txt; then
            echo "ERROR: main app missing application-groups entitlement"
            exit 1
          fi
          echo ""
          echo "=== Widget extension entitlements ==="
          WIDGET_PATH="$APP_PATH/PlugIns/LucidHealthWidgets.appex"
          if [ -d "$WIDGET_PATH" ]; then
            codesign -d --entitlements - "$WIDGET_PATH" 2>&1 | tee widget-ent.txt || true
            if ! grep -q "application-groups" widget-ent.txt; then
              echo "ERROR: widget extension missing application-groups entitlement"
              exit 1
            fi
          else
            echo "ERROR: widget extension not embedded"
            exit 1
          fi
          echo "Both targets have application-groups entitlement"

      - name: Package IPA
        run: |
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "LucidHealth.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find LucidHealth.app"
            find $RUNNER_TEMP/DerivedData -name "*.app" -type d
            exit 1
          fi

          if [ -d "$APP_PATH/PlugIns/LucidHealthWidgets.appex" ]; then
            echo "Widget extension present — keeping its _CodeSignature intact"
          else
            echo "ERROR: Widget extension not found"
            exit 1
          fi

          xattr -cr "$APP_PATH"

          mkdir -p $RUNNER_TEMP/Payload
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/LucidHealth.app"
          cd $RUNNER_TEMP
          ditto -c -k --sequesterRsrc --keepParent Payload LucidHealth.ipa
          echo "IPA size: $(du -h LucidHealth.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LucidHealth-adhoc
          path: ${{ runner.temp }}/LucidHealth.ipa
          retention-days: 30

      # The IPA carries the login credential compiled in, so it must not sit on a
      # public GitHub Release. AltStore installs from the Supabase bucket below;
      # the release step was pure exposure with nothing depending on it.
      # (Removed 2026-08-20 after builds 177 and 178 were published and pulled.)

      - name: Stage IPA for source build (ephemeral — never committed)
        run: |
          # public/ is gitignored (IPA + source.json untracked for privacy).
          # mkdir so a fresh checkout has the dir; it's only runner-local staging
          # for the Supabase upload below, never committed back to the repo.
          mkdir -p public
          cp $RUNNER_TEMP/LucidHealth.ipa public/LucidHealth.ipa
          echo "IPA staged in public/ (gitignored; goes to Supabase, not git)"

      - name: Update AltStore Source JSON (merge — preserve sibling apps)
        env:
          RUN_NUMBER: ${{ env.BUILD_NUM }}
          SUPABASE_STORAGE_PUBLIC_BASE: ${{ vars.SUPABASE_STORAGE_PUBLIC_BASE }}
        run: |
          IPA_SIZE=$(stat -f%z $RUNNER_TEMP/LucidHealth.ipa)
          # The binary's real floor, not a guess. Declaring 16.0 while the app
          # needs 26.0 makes AltStore offer an install that then fails on device.
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$RUNNER_TEMP/Payload/LucidHealth.app/Info.plist" 2>/dev/null || echo "16.0")
          echo "Declaring minOSVersion=${MIN_OS}"
          BUILD_DATE_ISO=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          STORAGE_BASE="${SUPABASE_STORAGE_PUBLIC_BASE}"
          # Versioned URL — AltStore client-side cache key is the URL. By making
          # each build's IPA URL unique, AltStore can never serve a stale IPA
          # from cache after a source refresh, eliminating the recurring
          # "data isn't in the correct format" error users hit on update.
          DOWNLOAD_URL="${STORAGE_BASE}/LucidHealth-${RUN_NUMBER}.ipa"

          # Fetch current manifest (has LucidBridge + LucidFoods entries) — fallback to public/ copy
          curl -fsS "${STORAGE_BASE}/altstore-source.json" > /tmp/cur.json \
            || cp public/altstore-source.json /tmp/cur.json

          NEW_ENTRY=$(cat <<JSONEND
          {
            "name": "Lucid Health",
            "bundleIdentifier": "com.fabi.lucidhealth",
            "developerName": "Fabi",
            "localizedDescription": "Unified health companion - streams Whoop BLE data and logs meals with Gemini Vision to surface brain-health patterns.",
            "iconURL": "https://app.lucid-ai.app/icon-512.png",
            "tintColor": "#8B5CF6",
            "screenshotURLs": [],
            "version": "1.0.${RUN_NUMBER}",
            "buildVersion": "${RUN_NUMBER}",
            "versionDate": "${BUILD_DATE_ISO}",
            "downloadURL": "${DOWNLOAD_URL}",
            "size": ${IPA_SIZE},
            "minOSVersion": "${MIN_OS}",
            "versions": [{"version":"1.0.${RUN_NUMBER}","buildVersion":"${RUN_NUMBER}","date":"${BUILD_DATE_ISO}","size":${IPA_SIZE},"downloadURL":"${DOWNLOAD_URL}","localizedDescription":"Build ${RUN_NUMBER}","minOSVersion":"${MIN_OS}"}],
            "appPermissions": {"entitlements":[{"name":"com.apple.security.application-groups"}],"privacy":[{"name":"NSBluetoothAlwaysUsageDescription","usageDescription":"Connects to Whoop via BLE."},{"name":"NSBluetoothPeripheralUsageDescription","usageDescription":"Connects to Whoop via BLE (legacy peripheral key)."},{"name":"NSCameraUsageDescription","usageDescription":"Take photos of meals."},{"name":"NSPhotoLibraryUsageDescription","usageDescription":"Pick existing meal photos."},{"name":"NSHealthShareUsageDescription","usageDescription":"Reads health data from Apple Health for body-state correlation."},{"name":"NSHealthUpdateUsageDescription","usageDescription":"Writes recovery and HRV data back to Apple Health."},{"name":"NSLocationWhenInUseUsageDescription","usageDescription":"Tags meals and body-state snapshots with location."},{"name":"NSLocationAlwaysAndWhenInUseUsageDescription","usageDescription":"Background location for activity context (rides, walks)."}]}
          }
          JSONEND
          )

          jq --argjson newApp "$NEW_ENTRY" \
            '.apps |= (map(select(.bundleIdentifier != "com.fabi.lucidhealth")) + [$newApp])' \
            /tmp/cur.json > public/altstore-source.json

      - name: Upload IPA + source.json + ADP manifest to Supabase Storage
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_STORAGE_WRITE_BASE: ${{ vars.SUPABASE_STORAGE_WRITE_BASE }}
          RUN_NUMBER: ${{ env.BUILD_NUM }}
        run: |
          STORAGE_BASE="${SUPABASE_STORAGE_WRITE_BASE}"

          # Generate per-build ADP manifest so AltStore PAL's version check passes
          # (must match source.json's version + buildVersion for THIS build)
          cat > /tmp/lucidhealth-manifest.json <<MANIFEST
          {
            "appleItemId": "9000000002",
            "bundleId": "com.fabi.lucidhealth",
            "shortVersionString": "1.0.${RUN_NUMBER}",
            "bundleVersion": "${RUN_NUMBER}"
          }
          MANIFEST

          echo "Uploading lucidhealth-manifest.json (ADP manifest for AltStore PAL)..."
          curl -fsS -X PUT "${STORAGE_BASE}/lucidhealth-manifest.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @/tmp/lucidhealth-manifest.json

          echo ""
          echo "Uploading altstore-source.json..."
          curl -fsS -X PUT "${STORAGE_BASE}/altstore-source.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @public/altstore-source.json

          echo ""
          echo "Uploading LucidHealth-${{ env.BUILD_NUM }}.ipa (versioned)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidHealth-${{ env.BUILD_NUM }}.ipa" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @$RUNNER_TEMP/LucidHealth.ipa

          echo ""
          echo "Also uploading canonical LucidHealth.ipa (back-compat for source caches)..."
          curl -fsS -X PUT "${STORAGE_BASE}/LucidHealth.ipa" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @$RUNNER_TEMP/LucidHealth.ipa

          echo ""
          echo "Storage upload complete."

      # NOTE: the old "Push AltStore Source" step was removed deliberately.
      # It force-committed (git add -f) the IPA + altstore-source.json back into
      # this PUBLIC repo every build, which re-published the exact artifacts the
      # security commit (6054aac) untracked. AltStore reads the source + IPA from
      # Supabase Storage (uploaded above), so the repo copy was redundant AND a
      # privacy regression. Removing it also kills the bot commits that caused the
      # recurring "remote ahead" push races. Build artifacts now live only in
      # Supabase, never in git — matching .gitignore's "never commit (security)".
